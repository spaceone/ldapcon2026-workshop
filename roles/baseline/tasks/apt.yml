- name: Unattended upgrades
  debconf:
    name: unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    vtype: boolean
    value: 'true'

- name: python3-apt
  apt:
    install_recommends: no
    name:
      - python3-apt
    state: present

- name: System update
  apt:
    cache_valid_time: 86400
    update_cache: yes
    upgrade: dist

- name: Packages
  apt:
    install_recommends: no
    name:
      - firewalld
      - sudo
      - unattended-upgrades
      - patch
      - etckeeper
      - git
      - rsync # synchronize
      - tmux
      - python3-debian
    state: latest
