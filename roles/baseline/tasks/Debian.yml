- name: Unattended upgrades
  debconf:
    name: unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    vtype: boolean
    value: 'true'

- name: python3-apt
  apt:
    install_recommends: no
    name:
      - python3-apt
    state: present

- name: System update (Debian/Ubuntu)
  apt:
    cache_valid_time: 86400
    update_cache: yes
    upgrade: dist

- name: Debian-specific packages
  apt:
    install_recommends: no
    name:
      - unattended-upgrades
    state: latest
