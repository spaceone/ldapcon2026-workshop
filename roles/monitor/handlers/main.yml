- name: restart prometheus
  service:
    name: prometheus
    state: restarted
  listen: prometheus config changed

- name: restart alertmanager
  service:
    name: alertmanager
    state: restarted
  listen: alertmanager config changed

- name: restart grafana-server
  service:
    name: grafana-server
    state: restarted
  listen: grafana config changed

